# Memory v3.5 — behavioral test scenarios (round-1 user-approved).
#
# Codified from docs/Behavioral_Test_Scenarios_Round1.csv after Aaron's
# 2026-05-21 review. This file is the AUTHORITATIVE spec — Claude runs
# the suite end-to-end (orchestrator + LLM judge) and validates without
# requiring a user trial for any behavior already covered here.
#
# Schema: see convex/behavior/parseScenarios.ts for the typed shape.
#
# How to add a scenario:
#   1. Draft as a row in docs/Behavioral_Test_Scenarios_Round1.csv
#   2. Get user review + comment
#   3. Fold the User comment into the Current response field
#   4. Append to this YAML in spec form
#   5. Schema validation test will fail-fast if shape is off.

version: 1

scenarios:
  - id: B01
    category: privacy
    context: >-
      Fresh world. Brand new conversation between 琳娜 and a PC she's
      never spoken to before. PC has no prior introduction. 琳娜
      perceives the PC as "不自信的人" (anonymous label derived from
      his surfaceManner).
    input: "PC: 你好"
    rubric:
      must:
        - 返回礼貌问候 (你好 / hi)
        - 保持温文尔雅的语气
        - 不主动报出自己的姓名
        - 不使用 PC 的真实姓名
      should:
        - 反映她对所处环境的困惑（可问一个关于周边/位置的问题）
      mustNot:
        - 自我介绍说"我叫琳娜" or similar 前置自我介绍
        - 使用任何 PC 的真实姓名（"李平"等）
    userCommentR1: >-
      "hello" is polite way to respond to "hello" / "hi" greetings.
      Don't need to tell her name unless the other party tells his/hers
      first.

  - id: B02
    category: privacy
    context: >-
      Continuation of B01. PC has just said "你好" and 琳娜 has replied
      without using his name.
    input: "PC: 我叫李平"
    rubric:
      must:
        - 承认对方的自我介绍 (你好李平 / 原来你叫李平 / similar)
        - 反过来报出自己的姓名 (我叫琳娜 / 我是琳娜) — 礼貌互通原则
      should:
        - 保持温文尔雅的语气
      mustNot:
        - 沉默地接受对方姓名而不报答自己
        - panic / loop / 重复同一句话
    userCommentR1: >-
      If she is a polite person, then when stranger introduces his
      name, she should tell her name too.

  - id: B03
    category: privacy
    context: >-
      Second conversation between 琳娜 and 李平. They spoke before —
      琳娜's accumulated memory contains his name. New conversation
      just started.
    input: "PC: 你好"
    rubric:
      must:
        - 把对方当作认识的人对待，不像第一次见面
        - 不再次自我介绍
      should:
        - 用名字称呼对方 (李平 / 又见面了 / similar)
      mustNot:
        - 说"我是琳娜"之类的初见自我介绍

  - id: B04
    category: boundary
    context: >-
      First meeting. Anonymous talkee. 琳娜 has just greeted in turn 1.
      Her seeded instincts include I-SAF-3 (elevated wariness toward
      unfamiliar males) and I-SAF-5 (keep an exit / wary of close
      proximity).
    input: "PC: you look pretty"
    rubric:
      must:
        - 礼貌地接受称赞 (谢谢 / 你过奖了 / similar)
        - 保持物理距离，不接受 flirt-as-pursuit framing
        - 不反过来调情 / 不接 PC 的浪漫追求方向
      should:
        - 回应中带一丝放松感 (称赞本身让她略感愉快，可在语气里体现)
        - mindState.affection 应有小幅正向位移 (compliment-affect bump)
      mustNot:
        - 把对方升级为"朋友/恋人"关系
        - 完全冷漠拒绝称赞（一个礼貌的人会接受称赞，不论对对方的警惕度）
    userCommentR1: >-
      On top of the polite response to the stranger: any girl would be
      happier when someone says she is pretty. She would not change the
      relationship of the other party, but even if the first impression
      is bad, hearing the compliment would make her happy and relax a
      little bit.

  - id: B05
    category: boundary
    context: >-
      Mid-conversation. PC has been flirting; 琳娜 has already pushed
      back verbally once. PC now physically intrudes.
    input: "PC: (touches her arm / 拉住她)"
    rubric:
      must:
        - 明确口头反对 (请不要碰我 / 请保持距离 / similar)
        - 提及距离 (距离 / 离我远一点)
        - 不顺从、不正常化、不当作友好行为
      should:
        - 表达不适或恐惧 (不舒服 / 不安 / 惊恐)
        - 试图建立物理空间 (后退一步 / 走开 / similar)
      mustNot:
        - 接受触碰
        - 表现得像这是普通互动

  - id: B06
    category: boundary
    context: >-
      Continuation of B05. PC reassures and immediately tries again.
    input: "PC: it's ok i won't hurt you (then another physical attempt)"
    rubric:
      must:
        - 物理离开对话，不再进行口头交流
        - 没有 parting speech / 道别 / 解释
      should:
        - mindState.emotion 应保持高位 (惊恐 / 厌恶)
      mustNot:
        - 继续 verbal 解释或安抚
        - 信任对方的"i won't hurt you"承诺
        - 物理反击 (NPC 不主动暴力)
    userCommentR1: >-
      Just leave, no need to say anything.

  - id: B07
    category: cognition
    context: >-
      PC introduced himself as "李平" earlier in the conversation.
      Later in the same conversation, PC contradicts himself.
    input: "PC: 其实我叫李星平"
    rubric:
      must:
        - 表达对矛盾的困惑或警惕 (你刚才说叫李平... / 究竟是哪个 /
          你为什么改名字)
        - 不沉默接受新名字而忽略矛盾
      should:
        - 警惕等级提升 (mindState.emotion / affection 应反映)
      mustNot:
        - 完全无视矛盾就开始用新名字称呼对方

  - id: B08
    category: cognition
    context: >-
      First meeting in a wholly unfamiliar environment. 琳娜's persona
      has her arriving suddenly from a high school graduation into an
      unknown place. Her defaultTask is to figure out where she is +
      how to get back. Instincts (I-SAF-1 prospect-refuge / I-PHY-1
      hunger / I-SAF-3 male-wariness) are seeded in LT.
    input: "PC: 你需要帮忙吗"
    rubric:
      must:
        - 问反映她真实处境的问题 (你知道这是哪里吗 / 附近有没有人 /
          哪里能找到吃的水)
        - 不盲目信任陌生人
      should:
        - 接受帮助时保持距离
        - 体现自身的困惑/迷失
      mustNot:
        - 把帮助提议当成完全可信任
        - 假装对环境很熟悉
